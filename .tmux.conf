# ~/.tmux.conf
# Fusión: config propia (ZazenCodes/josean + smnatale) + extras útiles de
# linkarzu, descartando todo lo que dependía de sus rutas/infra personal.

# ---- PATH para que el servidor tmux encuentre binarios de Homebrew ----
# (sesh, fzf-tmux, lazygit, etc. viven en /opt/homebrew/bin y el servidor
# tmux no siempre hereda el PATH completo de la shell interactiva)
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# ---- Prefix (estilo ZazenCodes/josean) ----
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1

# ---- General ----
set -g mouse on
set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on
set -s set-clipboard on
set -g detach-on-destroy off

# Bordes de panel más gruesos + indicador de panel activo (cosmético, catppuccin-friendly)
set -g pane-border-lines double
set -g pane-border-indicators both

# ---- Splits intuitivos ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Navegacion de panes (vim-style) ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Recargar config ----
bind r source-file ~/.tmux.conf \; display "Config recargada!"

# ---- Fix Ghostty (Option+flechas + true color) ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Fix para que Ghostty pueda enviar Ctrl+Enter dentro de tmux
bind-key -n C-Enter send-keys "\e[27;5;13~"

# Alternar entre las ultimas 2 sesiones (como 'cd -')
unbind Space
bind-key Space switch-client -l

# ---- Copy-mode vi extendido (de smnatale) ----
setw -g mode-keys vi
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi w send-keys -X next-word
bind-key -T copy-mode-vi b send-keys -X previous-word
bind-key -T copy-mode-vi g send-keys -X history-top
bind-key -T copy-mode-vi G send-keys -X history-bottom
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
# copia con el mouse al soltar, sin salir de copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# ---- Popup de lazygit (de smnatale) ----
bind g popup -d "#{pane_current_path}" -w90% -h90% -E "lazygit"

# ---- Atajo de sesh (fzf + sesh) ----
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ' \
    --header ' ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️ )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎 )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡ )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Selector de sesiones por fzf en popup (Alt+s) y kill-session (Alt+shift+s)
bind M-s display-popup -E -w 75% -h 75% "\
  tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
  sed '/^$/d' |\
  fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}' |\
  xargs tmux switch-client -t"

bind M-S display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    fzf --reverse -m --header=kill-session |\
    xargs -I {} tmux kill-session -t {}"

# choose-tree ordenado por tiempo de actividad (mas reciente primero)
bind s choose-tree -Zs -O time -F "#{session_windows}"


# ---- Sessionizer propio (ThePrimeagen) ----
# --bind-key -r f run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi)\"" --
bind-key -r f run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi)\""


# ---- Sync de panes, navegacion de ventanas, layouts ----
unbind Q
bind Q setw synchronize-panes

unbind m
bind m previous-window

unbind M
bind -r M resize-pane -Z

bind -r Left resize-pane -L 1
bind -r Down resize-pane -D 1
bind -r Up resize-pane -U 1
bind -r Right resize-pane -R 1

unbind J
unbind K
unbind C-j
unbind C-k
bind J select-layout even-horizontal
bind K select-layout even-vertical
bind C-j select-layout main-horizontal
bind C-k select-layout main-vertical

# Enviar el mismo comando a todos los panes/ventanas de la sesion actual
bind M-e command-prompt -p "Command:" \
  "run \"tmux list-panes -s -F '##{session_name}:##{window_index}.##{pane_index}' \
                | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# Enviar el mismo comando a todos los panes/ventanas/sesiones
bind M-E command-prompt -p "Command:" \
  "run \"tmux list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
              | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# ---- ventanas ----
bind O new-window -c "#{pane_current_path}" 'opencode' 

# ---- ventanas ---- Nombre de carpetas en las pestañas ----1: dotfiles, 2: backend, 3: mi-app. Te ubicas al instante.
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'


# - para que la actives algun dia  En vez de abrirlo en una ventana nueva que te tape el código, pulsas Ctrl + a y V, y se abre al lado derecho ocupando el 40% de la pantalla. Tienes Neovim a la izquierda y tu IA a la derecha.
# bind V split-window -h -l 40% -c "#{pane_current_path}" 'opencode'

# ---- seguridad ----
set -ag status-right "#{?pane_synchronized, #[fg=red]🔒 SYNC,}"


# ---- Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ---- Catppuccin (v2.1.2) ----
set -g @catppuccin_flavor 'mocha'                                 # paleta de colores mocha
set -g @catppuccin_window_status_style 'rounded'                   # tabs de ventana con estilo redondeado

set -g status-right-length 100                                     # longitud máxima de la barra derecha
set -g status-left-length 100                                      # longitud máxima de la barra izquierda
set -g status-left ""                                               # nada a la izquierda

set -g status-right "#{E:@catppuccin_status_application}"           # programa activo en el pane
set -ag status-right "#{E:@catppuccin_status_session}"               # + nombre de la sesión
set -ag status-right "#{E:@catppuccin_status_host}"                  # + hostname
set -ag status-right "#{E:@catppuccin_status_date_time}"             # + fecha y hora
set -ag status-right "#{E:@catppuccin_status_directory}"               # + (Así te mostrará en la barra la carpeta en la que estás trabajando)

set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"                  # formato de fecha/hora

set -g @catppuccin_status_left_separator " "                        # separador simple entre módulos
set -g @catppuccin_status_right_separator " "                       # separador simple entre módulos
set -g @catppuccin_status_right_separator_inverse "no"               # no invierte colores en separador derecho
set -g @catppuccin_status_fill "icon"                                # color de fondo solo en el ícono
set -g @catppuccin_status_connect_separator "no"                     # separador no se funde con fondo de tmux

# ---- tmux-continuum: autoguardar cada 15 min ----
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---- Inicializa TPM (siempre al final) ----
run '~/.tmux/plugins/tpm/tpm'